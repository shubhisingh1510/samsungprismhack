<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEST brand marks</title>
<style>
body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#292724;background:#FFF9F2}
main{max-width:1000px;margin:0 auto;padding:56px 24px}
h1{font:400 44px/1 Georgia,serif;margin:0 0 6px} p{margin:0 0 40px;color:#6b665f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
figure{margin:0} .tile{height:220px;display:grid;place-items:center;border:1px solid #2927241f}
.dark{background:#292724;border-color:#292724} .mono{color:#292724}
figcaption{padding:10px 2px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
img,svg{display:block}
</style></head><body><main>
<h1>NEST</h1><p>small moments. bigger worlds. Two curved strokes: a shelter, and the doorway inside it.</p>
<div class="grid">
<figure><div class="tile"><img src="nest-logo-light.svg" width="230" alt="NEST primary logo"></div><figcaption>01 Primary horizontal · light background</figcaption></figure>
<figure><div class="tile dark"><img src="nest-logo-dark.svg" width="230" alt="NEST logo on dark"></div><figcaption>02 Dark background</figcaption></figure>
<figure><div class="tile"><img src="nest-symbol.svg" width="96" alt="NEST symbol"></div><figcaption>03 Symbol</figcaption></figure>
<figure><div class="tile"><img src="nest-app-icon.svg" width="120" alt="NEST app icon"></div><figcaption>04 App icon</figcaption></figure>
<figure><div class="tile" style="background:#DDE8D7"><img src="nest-logo-mono.svg" width="230" alt="NEST monochrome"></div><figcaption>05 Monochrome (one ink)</figcaption></figure>
<figure><div class="tile"><img src="nest-symbol.svg" width="20" alt=""><img src="nest-symbol.svg" width="32" alt="" style="margin-left:40px;position:absolute;transform:translateX(50px)"></div><figcaption>06 Small sizes · 20 and 32 px</figcaption></figure>
</div></main></body></html>
